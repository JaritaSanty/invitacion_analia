<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Primera Comunión">
    <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c7ad7c" />
            <stop offset="0.55" stop-color="#a08456" />
            <stop offset="1" stop-color="#6f5832" />
        </linearGradient>
        <radialGradient id="paper" cx="50%" cy="40%" r="60%">
            <stop offset="0" stop-color="#fbf5e8" />
            <stop offset="1" stop-color="#ead9c0" />
        </radialGradient>
    </defs>

    <!-- Fondo medallón -->
    <circle cx="32" cy="32" r="30" fill="url(#paper)" stroke="#a08456" stroke-width="1.4" />
    <circle cx="32" cy="32" r="27" fill="none" stroke="#c7ad7c" stroke-width="0.6" opacity="0.7" />

    <!-- Rayos sobre la hostia -->
    <g stroke="#a08456" stroke-width="0.7" stroke-linecap="round" opacity="0.55">
        <line x1="32" y1="6" x2="32" y2="9" />
        <line x1="24" y1="9" x2="25.5" y2="11.5" />
        <line x1="40" y1="9" x2="38.5" y2="11.5" />
        <line x1="18" y1="14" x2="20.5" y2="15.5" />
        <line x1="46" y1="14" x2="43.5" y2="15.5" />
    </g>

    <!-- Hostia con cruz -->
    <circle cx="32" cy="17" r="6.2" fill="#fff8ec" stroke="url(#gold)" stroke-width="1.1" />
    <g stroke="#8b4d4d" stroke-width="1" stroke-linecap="round">
        <line x1="32" y1="13" x2="32" y2="21" />
        <line x1="28" y1="17" x2="36" y2="17" />
    </g>

    <!-- Copa del cáliz -->
    <path d="M19 25 L45 25 Q44 36 36.5 40 Q34 41.5 32 42 Q30 41.5 27.5 40 Q20 36 19 25 Z"
        fill="url(#gold)" stroke="#6f5832" stroke-width="0.9" stroke-linejoin="round" />
    <path d="M19 25 L45 25" stroke="#6f5832" stroke-width="1.4" stroke-linecap="round" />
    <path d="M22 28 Q32 31 42 28" fill="none" stroke="#fff8ec" stroke-width="0.6" opacity="0.6" />

    <!-- Tallo y nudo -->
    <line x1="32" y1="42" x2="32" y2="49" stroke="#6f5832" stroke-width="1.8" stroke-linecap="round" />
    <ellipse cx="32" cy="46" rx="2.6" ry="1.4" fill="url(#gold)" stroke="#6f5832" stroke-width="0.6" />

    <!-- Base -->
    <path d="M24 52 Q32 49.5 40 52 L40 53 Q32 51 24 53 Z" fill="url(#gold)" stroke="#6f5832"
        stroke-width="0.7" stroke-linejoin="round" />
    <line x1="22" y1="54" x2="42" y2="54" stroke="#6f5832" stroke-width="1.6" stroke-linecap="round" />
</svg>
